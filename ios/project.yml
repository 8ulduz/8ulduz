# Xcode layihəsi bu fayldan yaranır: `xcodegen generate` (ios/README.md).
name: Ulduz8
options:
  bundleIdPrefix: az.ulduz8
  developmentLanguage: az
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
packages:
  UlduzCore:
    path: Packages/UlduzCore
targets:
  Ulduz8:
    type: application
    platform: iOS
    sources:
      - path: App
      # Qırmızı xətt 2-nin qaydaları: sayt və updater ilə eyni fayl, kopyası yoxdur.
      - path: ../assets/content-policy.js
        buildPhase: resources
    dependencies:
      - package: UlduzCore
      - target: Ulduz8Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.ulduz8.app
        PRODUCT_NAME: 8ulduz
        PRODUCT_MODULE_NAME: Ulduz8
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  Ulduz8Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: ../assets/content-policy.js
        buildPhase: resources
    dependencies:
      - package: UlduzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.ulduz8.app.widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
  Ulduz8UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Ulduz8
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.ulduz8.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Ulduz8:
    build:
      targets:
        Ulduz8: all
        Ulduz8Widget: all
    test:
      config: Debug
      targets:
        - Ulduz8UITests
    run:
      config: Debug
    archive:
      config: Release
