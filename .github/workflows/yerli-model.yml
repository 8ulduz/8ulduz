name: Yerli model sınağı (müvəqqəti)

# Müvəqqəti: açıq model (Gemma 3) GitHub maşınının özündə işləyib Azərbaycan dilində mətni necə yazır, nə qədər vaxt aparır.
# Sayta heç nə yazmır: yalnız oxuyur. Bu budaq birləşdirilmir.
on:
  pull_request:
    paths: ['.github/workflows/yerli-model.yml', '.github/yerli_model.py']

permissions:
  contents: read

jobs:
  yoxla:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/yerli_model.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Maşın
        run: |
          nproc; free -g | head -2; df -h / | tail -1
      - name: Paket (PyPI)
        run: |
          start=$(date +%s)
          pip install --disable-pip-version-check -q llama-cpp-python==0.3.36
          echo "quraşdırma: $(( $(date +%s) - start )) s"
      - name: Yoxla
        run: python -u .github/yerli_model.py
