name: iOS tətbiqi
# ios/ qovluğundan iPhone tətbiqini yığır, testləri simulyatorda işlədir və App Store ekran şəkillərini çəkir.
# Əl ilə işə salanda (Actions → iOS tətbiqi → Run workflow → testflight) imzalayıb TestFlight-a göndərir.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64, APPLE_TEAM_ID (ios/README.md).
on:
  pull_request:
    paths: ['ios/**', 'assets/content-policy.js', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'assets/content-policy.js', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'TestFlight-a göndər'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Alətlər
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen xcbeautify
          xcodegen --version

      - name: Məntiq testləri (qırmızı xətlər, məlumat zənciri, real lent)
        run: swift test --package-path ios/Packages/UlduzCore

      - name: Layihəni yarat
        working-directory: ios
        run: xcodegen generate

      - name: Simulyatoru hazırla
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          found = []
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = [int(x) for x in re.findall(r"\d+", runtime.split("iOS")[-1])]
              for d in devices:
                  if "Pro Max" in d["name"]:
                      found.append((version, d["name"], d["udid"]))
          found.sort()
          print(found[-1][2])
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Yığ və simulyatorda sına
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Ulduz8.xcodeproj \
            -scheme Ulduz8 \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath build/test.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --renderer github-actions

      - name: Cihaz üçün yığım (imzasız)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/Ulduz8.xcodeproj \
            -scheme Ulduz8 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/8ulduz-imzasiz.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --renderer github-actions

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ekran-sekilleri
          path: screenshots/
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-neticesi
          path: build/test.xcresult
          retention-days: 7
          if-no-files-found: ignore

  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Açarı hazırla
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in ASC_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!name}" ] || { echo "::error::$name secret-i yoxdur (ios/README.md)."; exit 1; }
          done
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_BASE64" | base64 -d > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Layihəni yarat
        working-directory: ios
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: İmzala və göndər
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Sertifikat kompüterdə saxlanmır: Apple imzanı buludda edir (App Manager rolu olan API açarı).
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Build nömrəsi hər yığımda artır: App Store eyni nömrəni ikinci dəfə qəbul etmir.
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          xcodebuild archive \
            -project ios/Ulduz8.xcodeproj \
            -scheme Ulduz8 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/8ulduz.xcarchive \
            "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            | xcbeautify --renderer github-actions
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/Config/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/8ulduz.xcarchive \
            -exportOptionsPlist ios/Config/ExportOptions.plist \
            -exportPath build/export \
            "${AUTH[@]}" \
            | xcbeautify --renderer github-actions
          echo "### TestFlight: build $BUILD göndərildi" >> "$GITHUB_STEP_SUMMARY"

      - name: Açarı sil
        if: always()
        run: rm -f "$ASC_KEY_PATH"
