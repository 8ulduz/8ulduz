name: Kodu yoxla
on:
  pull_request:
    paths: ['assets/**', 'updater.py', 'sw.js', 'tests/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['assets/**', 'updater.py', 'sw.js', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check assets/app.js && node --check sw.js
      - run: node --test tests/browser-logic.test.cjs
