name: Kodu yoxla
on:
  pull_request:
    paths: ['assets/**', 'updater.py', 'reader_content.py', 'sw.js', 'tests/**', '.github/**', 'manifest.webmanifest', '.well-known/**', 'android/**']
  push:
    branches: [main]
    paths: ['assets/**', 'updater.py', 'reader_content.py', 'sw.js', 'tests/**', '.github/**', 'manifest.webmanifest', '.well-known/**', 'android/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python testləri (uğursuzluqlar annotasiya kimi, girişsiz görünür)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/ut.txt || {
            grep -nE '^(FAIL|ERROR):|Error:|^AssertionError|^  File "' /tmp/ut.txt | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - run: node --check assets/app.js && node --check assets/assistant.js && node --check assets/reader.js && node --check assets/source-stats.js && node --check sw.js
      - run: node --test tests/*.test.cjs
      # Sınıq workflow faylı main-ə düşsə yeniləmə tamamilə dayanır — PR-da tutulsun.
      - name: Workflow fayllarını yoxla (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck= -pyflakes=
