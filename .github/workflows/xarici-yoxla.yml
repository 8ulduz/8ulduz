name: Xarici mənbə sınağı (müvəqqəti)

# Müvəqqəti: açıq xarici lentlərin və açarsız tərcümənin GitHub-dan açılıb-açılmadığını yoxlayır.
# Sayta heç nə yazmır: yalnız oxuyur. Bu budaq birləşdirilmir.
on:
  pull_request:
    paths: ['.github/workflows/xarici-yoxla.yml', '.github/xarici_yoxla.py']

permissions:
  contents: read

jobs:
  yoxla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Yoxla
        run: PYTHONPATH=. python -u .github/xarici_yoxla.py
