name: Xəbər arxivi
# Paylaşılan keçid günlər sonra da açılsın: saytın lentlərindəki hər xəbərin sətri «arxiv» budağına, saata görə bir faylda
# (.github/scripts/arxiv.cjs). main-ə və sayta (GitHub Pages) fayl əlavə olunmur, budaq tarixçəsizdir. Xəbər axınından ayrıdır.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/arxiv.yml
      - .github/scripts/arxiv.cjs

permissions:
  contents: write

concurrency:
  group: arxiv
  cancel-in-progress: false

jobs:
  arxiv:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/arxiv.cjs
            .github/scripts/topics.cjs
            assets/app.js
            assets/content-policy.js
          sparse-checkout-cone-mode: false
      - name: Arxiv budağı
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        # Boş başlanğıc yalnız budaq doğrudan yoxdursa (ls-remote çıxış kodu 2). Klon başqa səbəbdən alınmayanda əvvəl də boş
        # repodan başlanırdı: arxiv.cjs yalnız lentdəki saatları yazıb budağı məcburi göndərir, 400 günün arxivi və idx/ silinərdi.
        run: |
          if ! git clone -q --depth 1 --filter=blob:none --no-checkout --branch arxiv "$URL" .arxiv 2>/dev/null; then
            rm -rf .arxiv
            code=0
            git ls-remote --exit-code --heads "$URL" arxiv >/dev/null 2>&1 || code=$?
            if [ "$code" != 2 ]; then
              echo "::error::arxiv budağı klonlanmadı (ls-remote: $code): dövrə ötürülür, budağa toxunulmur"
              exit 1
            fi
            git init -q .arxiv && git -C .arxiv remote add origin "$URL"
          fi
      - name: Yaz
        run: node .github/scripts/arxiv.cjs . .arxiv
