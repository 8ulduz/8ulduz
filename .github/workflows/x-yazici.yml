name: X xəbərləri yazıcısı
# X-in türk dilli rəsmi hesablarının videolu paylaşımlarından 8ULDUZ-un öz xəbərləri (oz_x.py, docs/x-yazici.md).
# Sahib, 2026-11-18: «bunu avtomatlaşdır. claude nin açıq bağlı olmasına bağlama»; icazə: iş yalnız oz_x.json-u dəyişir
# və birbaşa main-ə göndərir. Mətni Gemini yazır (GEMINI_API_KEY, pulsuz səviyyə; sahib 2026-11-18: «Başqa yol» —
# Claude API açarı yoxdur). Açar yoxdursa iş yalnız X-i oxuyur və namizədləri sayır, heç nə yazmır. Dərc etmir: xəbəri yavaş dövrədə dərc hissəsi (oz_derc) hədlərlə verir.

on:
  schedule:
    - cron: "5,25,45 * * * *"   # UTC; gecə-gündüz 20 dəqiqədən bir: qısa videolar hər işdə (sahib 2026-11-19: «daima təzələnsin»); xəbər yalnız Bakı 07–21 arası, tək saatların ilk işində (x_yazici.py)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-yazici
  cancel-in-progress: false

jobs:
  yaz:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # təkrar keçid (x_yazici.RETRY_*) ~5 dəq əlavə edir; üst-üstə düşmə yoxdur: xyazici_loop gedən işi gözləyir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Claude SDK (yalnız Gemini açarı yoxdursa və Claude açarı varsa)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -n "$ANTHROPIC_API_KEY" ]; then pip install --disable-pip-version-check -q anthropic; fi
      - name: Yaz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u .github/scripts/x_yazici.py
      - name: Növbəni main-ə göndər (yalnız oz_x.json)
        run: |
          if git diff --quiet -- oz_x.json; then echo "dəyişiklik yoxdur"; exit 0; fi
          git config user.name 8ulduz-bot   # pull --rebase da commit qurur: ad olmasa main irəli gedəndə iş düşür (2026-11-19)
          git config user.email bot@8ulduz.az
          git add oz_x.json
          git commit -q -m "X xəbərləri növbəyə əlavə edildi"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "push alınmadı"; exit 1
