name: Ölü kod sınağı (müvəqqəti)
on:
  pull_request:
    paths: [".github/workflows/lint-sinaq.yml"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: pyflakes və vulture
        run: |
          pip install -q pyflakes vulture
          echo "=== PYFLAKES"; pyflakes updater.py reader_content.py content_policy.py oz_*.py .github/scripts/*.py || true
          echo "=== VULTURE"; vulture updater.py reader_content.py content_policy.py oz_*.py .github/scripts/*.py --min-confidence 60 || true
      - name: eslint (istifadə olunmayanlar)
        run: |
          npm i -g eslint@9 >/dev/null 2>&1
          cat > /tmp/eslint.config.mjs <<'CFG'
          export default [{ files: ["**/*.js", "**/*.cjs"], languageOptions: { ecmaVersion: 2024, sourceType: "module", globals: { window: "readonly", document: "readonly", navigator: "readonly", location: "readonly", localStorage: "readonly", sessionStorage: "readonly", fetch: "readonly", console: "readonly", setTimeout: "readonly", clearTimeout: "readonly", setInterval: "readonly", clearInterval: "readonly", URL: "readonly", self: "readonly", caches: "readonly", require: "readonly", module: "writable", process: "readonly", __dirname: "readonly", Buffer: "readonly", globalThis: "readonly", history: "readonly", addEventListener: "readonly", removeEventListener: "readonly", requestAnimationFrame: "readonly", performance: "readonly", innerWidth: "readonly", innerHeight: "readonly", scrollY: "readonly", matchMedia: "readonly", Response: "readonly", Request: "readonly", Headers: "readonly", AbortController: "readonly", Intl: "readonly", IntersectionObserver: "readonly", getComputedStyle: "readonly", scrollTo: "readonly", open: "readonly", alert: "readonly", crypto: "readonly", TextEncoder: "readonly", TextDecoder: "readonly", Blob: "readonly", FormData: "readonly", Image: "readonly", Notification: "readonly", queueMicrotask: "readonly", structuredClone: "readonly", btoa: "readonly", atob: "readonly", screen: "readonly", Event: "readonly", CustomEvent: "readonly", HTMLElement: "readonly", MutationObserver: "readonly", ResizeObserver: "readonly", PerformanceObserver: "readonly", BroadcastChannel: "readonly", clients: "readonly", registration: "readonly", indexedDB: "readonly", WebSocket: "readonly", Audio: "readonly", speechSynthesis: "readonly", SpeechSynthesisUtterance: "readonly", DOMParser: "readonly", requestIdleCallback: "readonly", scrollX: "readonly", devicePixelRatio: "readonly", visualViewport: "readonly" } }, rules: { "no-unused-vars": ["warn", { args: "none", caughtErrors: "none" }], "no-unreachable": "warn", "no-dupe-keys": "warn", "no-duplicate-case": "warn" } }];
          CFG
          echo "=== ESLINT"; eslint -c /tmp/eslint.config.mjs --no-ignore assets/*.js sw.js .github/scripts/*.cjs -f unix 2>&1 | grep -v "app.min.js" || true
