name: Dinlə ölçməsi (müvəqqəti)
# Müvəqqəti: hər mənbədən mətnin GitHub-dan çıxarıla bildiyini ölçür. Birləşdirilmir.
on:
  pull_request:
    paths:
      - .github/workflows/dinle-olc.yml
      - .github/olc/**
permissions:
  contents: read
jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/ses.py
            content_policy.py
            assets/content-policy.js
            .github/olc
            reader_content.py
          sparse-checkout-cone-mode: false
      - run: python3 .github/olc/olc.py /tmp/olc 3
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: olc
          path: /tmp/olc
