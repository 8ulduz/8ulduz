name: Tıxac ölçüsü
# Sahib (2026-11-14): «avtomatik tıxac xəbərləri hazırlayıb verən sistem qur», «Bəli, Mapbox»; sonra kart bağladı. Mapbox Directions (driving-traffic).
# 35 marşrut (bütün rayonlar). Pik saatlar (Bakı 07–10, 17–20 = UTC 03–05, 13–15) hər 6 dəq, qalan vaxt (Bakı 10–17, 20–22) hər 30 dəq:
# 78 × 35 = 2 730/gün, ayda ≈ 84 600 < 100 000 (pulsuz hədd). Skript gündə 3 000 sorğudan çox göndərmir (dövrə bütöv buraxılır). Nəticə yalnız «tixac» budağına yazılır
# (tarixçəsiz: tixac.json, tarix.json, hafta.json); main-ə və xəbər lentinə heç nə yazılmır. Açar (MAPBOX_TOKEN) yalnız ölçü addımındadır.
# feat/tixac-* budaqlarında: yalnız yoxlama (nöqtələrin hansı yola düşdüyü), heç nə yazılmır.

# Cron ehtiyatdır: GitHub onu saatda bir işlədir. Ölçünü əsasən xəbər işi başladır (pipeline.sh tixac_loop, workflow_dispatch).
on:
  schedule:
    - cron: '*/6 3-5,13-15 * * *'
    - cron: '0,30 6-12,16-17 * * *'
  workflow_dispatch:
  push:
    branches: ['feat/tixac-**']

permissions:
  contents: read

concurrency:
  group: tixac
  cancel-in-progress: false

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/tixac.cjs
          sparse-checkout-cone-mode: false
      - name: Yoxlama (sınaq budağı)
        if: github.event_name == 'push'
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: node .github/scripts/tixac.cjs --yoxla
      - name: Ölç
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          # Əvvəlki ölçü budağın özündən (raw.githubusercontent ~5 dəq köhnə nüsxə verir: 6 dəqiqəlik ölçüdə son nöqtə itərdi).
          if git fetch -q --depth=1 origin tixac; then src() { git show "FETCH_HEAD:$1"; }
          else src() { curl -fsS --max-time 10 "https://raw.githubusercontent.com/${{ github.repository }}/tixac/$1?t=$(date +%s)"; }; fi
          for f in tixac tarix hafta; do src "$f.json" > "/tmp/$f.json" 2>/dev/null || echo '{}' > "/tmp/$f.json"; done
          node .github/scripts/tixac.cjs out /tmp/tixac.json /tmp/tarix.json /tmp/hafta.json
      - name: «tixac» budağına yaz
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          [ -f out/tixac.json ] || { echo "ölçü yoxdur (gündəlik hədd və ya son ölçü təzədir): yazılmır"; exit 0; }
          cd out
          git init -q
          git add tixac.json tarix.json hafta.json
          git -c user.name=8ulduz-bot -c user.email=bot@8ulduz.az commit -q -m "Tıxac ölçüsü"
          git push -q --force "$URL" HEAD:refs/heads/tixac
