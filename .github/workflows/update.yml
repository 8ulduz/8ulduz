name: Xəbərləri yenilə

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Xəbərləri yığ
        run: python updater.py
      - name: Dəyişikliyi saxla
        run: |
          git config user.name "8ulduz-bot"
          git config user.email "bot@8ulduz.az"
          git add data/news.json
          git commit -m "Xəbərlər yeniləndi" || echo "Dəyişiklik yoxdur"
          git push
