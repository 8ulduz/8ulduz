name: Xəbərləri yenilə
# QIRMIZI XƏTT 1 (docs/qirmizi-xetler.md). İş .github/scripts/pipeline.sh-dadır.
# concurrency qəsdən yoxdur: iş bitməzdən əvvəl növbətisi başlayır, növbə dəyişəndə boşluq olmur.
# Artıq iş işləyirsə, yeni başlayan iş özü dərhal çıxır.

on:
  schedule:
    # Cron ehtiyatdır. GitHub onu 20–40 dəqiqə gecikdirə və ya atıya bilər.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    # Yalnız main. Başqa budaqda işə salınsa xəbər commit-i o budağa getməsin.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Python yüklənməsə runner-in öz python3-ü ilə davam edirik.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
      # Son uğurla işləmiş kod. main-ə səhv kod düşsə, lent onunla yenilənməyə davam edir.
      - name: Son işlək kodu bərpa et
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .lkg
          key: updater-lkg2-${{ hashFiles('updater.py', 'reader_content.py', 'content_policy.py', 'assets/content-policy.js', '.github/scripts/check_outputs.py') }}
          restore-keys: updater-lkg2-
      - name: Hər 60 saniyədən bir yenilə
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/pipeline.sh
      - name: İşlək kodu yadda saxla
        if: ${{ always() && hashFiles('.lkg/.yeni') != '' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .lkg
          key: updater-lkg2-${{ hashFiles('.lkg/updater.py', '.lkg/reader_content.py', '.lkg/content_policy.py', '.lkg/assets/content-policy.js', '.lkg/.github/scripts/check_outputs.py') }}
      # Skript gözlənilmədən bitsə də zəncir qırılmasın.
      - name: Növbəti işi başlat
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          others="$(gh run list --workflow update.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and .status != \"completed\")] | length" || echo "")"
          if [ -n "$others" ] && [ "$others" != "0" ]; then
            echo "Başqa iş var ($others)."
            exit 0
          fi
          # GitHub qısa kəsilibsə dərhal təslim olmuruq: cron gec gələ bilər.
          for i in $(seq 1 20); do
            timeout -k 5 20 gh workflow run update.yml --ref main && exit 0
            sleep 15
          done
          echo "Dispatch alınmadı. Cron və nəzarətçi ehtiyat qalır."
