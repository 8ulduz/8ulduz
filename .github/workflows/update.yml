name: Xəbərləri yenilə

on:
  schedule:
    # Cron ehtiyatdır. GitHub onu 20–40 dəqiqə gecikdirə və ya atıya bilər.
    # Əsas davamlılıq işin sonundakı öz-özünə zəncirdir.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Bir dövrə işləyir, biri növbədə gözləyir. İşləyəni kəsmirik.
# Gözləyən ikinci iş yarananda əvvəlki gözləyən əvəz olunur, ona görə
# zəncir yalnız növbə boş olanda dispatch edir.
concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    # Yalnız main. Başqa budaqda işə salınsa xəbər commit-i o budağa getməsin.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hər 4 dəqiqədən bir yenilə
        run: |
          set -uo pipefail
          git config user.name "8ulduz-bot"
          git config user.email "bot@8ulduz.az"
          BRANCH="${GITHUB_REF_NAME}"
          SNAP="$(mktemp -d)"
          # Dövrənin özü ~50 dəq. Son yeniləmədən növbəti runner-in ilk yeniləməsinə
          # qədər boşluq runner-in açılış müddəti qədər olsun, 40 dəqiqə yox.
          DURATION=$((50 * 60))
          CYCLE=240
          START=$SECONDS
          last_result=1
          publish() {
            local i
            mkdir -p "$SNAP/data"
            cp -a data/news.json data/markets.json data/social.json data/status.json data/sources.json data/og.json data/video.json data/football.json "$SNAP/data/" || return 1
            [ -f data/sports.json ] && cp -a data/sports.json "$SNAP/data/"
            [ -f data/dates.json ] && cp -a data/dates.json "$SNAP/data/"
            cp -a sitemap.xml robots.txt feed.xml "$SNAP/" || return 1
            rm -rf "$SNAP/bolme"; [ -d bolme ] && cp -a bolme "$SNAP/bolme"
            for i in 1 2 3 4 5; do
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              mkdir -p data
              cp -a "$SNAP/data/." data/
              cp -a "$SNAP/sitemap.xml" "$SNAP/robots.txt" "$SNAP/feed.xml" ./
              if [ -d "$SNAP/bolme" ]; then rm -rf bolme; cp -a "$SNAP/bolme" bolme; git add bolme; fi
              [ -f data/sports.json ] && git add data/sports.json
              [ -f data/dates.json ] && git add data/dates.json
              git add data/news.json data/markets.json data/social.json data/status.json data/sources.json data/og.json data/video.json data/football.json sitemap.xml robots.txt feed.xml
              if git diff --cached --quiet; then
                echo "Dəyişiklik yoxdur"
                return 0
              fi
              git commit -m "Xəbərlər yeniləndi"
              if git push origin "HEAD:${BRANCH}"; then
                return 0
              fi
              echo "Push alınmadı, yenidən cəhd ($i)..."
              sleep 4
            done
            echo "Push alınmadı"
            return 1
          }
          while true; do
            begin=$SECONDS
            # Asılı fetch bütün 70 dəqiqəni yeməsin — əks halda iş ləğv olunur və zəncir düşmür.
            if timeout 240 python updater.py; then
              if publish; then last_result=0; else last_result=1; echo "Bu dövrənin push-u alınmadı"; fi
            else
              last_result=1
              # Toplayıcı köhnə lenti saxlayır, uğursuz cəhdin statusunu isə dərc edir.
              echo "updater.py xətası — diaqnostika dərc olunur"
              publish || echo "Xəta statusunun push-u alınmadı"
            fi
            now=$SECONDS
            left=$((DURATION - (now - START)))
            # Növbəti tam dövrə bu işin vaxtına sığmırsa, zəncirə burax.
            if [ "$left" -lt "$CYCLE" ]; then
              echo "Dövr bitdi (${now}s). Növbəti iş öz-özünə başlayacaq."
              exit "$last_result"
            fi
            sleep_for=$((CYCLE - (now - begin)))
            if [ "$sleep_for" -lt 1 ]; then
              sleep_for=1
            fi
            echo "Növbəti yoxlama ${sleep_for}s sonra (qalıq ${left}s)"
            sleep "$sleep_for"
          done
      - name: Növbəti dövrü başlat
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Gözləyən iş varsa onu əvəz etmirik (concurrency köhnə pending-i silir).
          waiting="$(gh run list --workflow update.yml --limit 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length' || echo "")"
          if [ -n "${waiting}" ] && [ "${waiting}" != "0" ]; then
            echo "Növbəti dövr artıq növbədədir (${waiting}). Yeni dispatch yoxdur."
            exit 0
          fi
          i=1
          while [ "$i" -le 5 ]; do
            if gh workflow run update.yml --ref main; then
              echo "Növbəti dövr növbəyə yazıldı"
              exit 0
            fi
            echo "Dispatch alınmadı ($i)"
            i=$((i + 1))
            sleep 3
          done
          echo "Zəncir alınmadı. Cron ehtiyat qalır."
          exit 0
