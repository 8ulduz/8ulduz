name: Xəbərləri yenilə

on:
  schedule:
    # GitHub bu cədvəli tez-tez 20–30 dəqiqə gecikdirir. Öz intervalımızı aşağıdakı dövr saxlayır.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Növbəti iş növbəyə durur və bu iş bitəndə başlayır — kəsilmir, boşluq qalmır.
concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hər 4 dəqiqədən bir yenilə
        run: |
          set -uo pipefail
          git config user.name "8ulduz-bot"
          git config user.email "bot@8ulduz.az"
          BRANCH="${GITHUB_REF_NAME}"
          SNAP="$(mktemp -d)"
          DURATION=$((55 * 60))
          INTERVAL=240
          START=$SECONDS
          publish() {
            local i
            mkdir -p "$SNAP"
            mkdir -p "$SNAP/data"
            cp -a data/news.json data/markets.json data/social.json data/status.json data/sources.json "$SNAP/data/" || return 1
            cp -a sitemap.xml robots.txt feed.xml "$SNAP/" || return 1
            for i in 1 2 3 4 5; do
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              mkdir -p data
              cp -a "$SNAP/data/." data/
              cp -a "$SNAP/sitemap.xml" "$SNAP/robots.txt" "$SNAP/feed.xml" ./
              git add data/news.json data/markets.json data/social.json data/status.json data/sources.json sitemap.xml robots.txt feed.xml
              if git diff --cached --quiet; then
                echo "Dəyişiklik yoxdur"
                return 0
              fi
              git commit -m "Xəbərlər yeniləndi"
              if git push origin "HEAD:${BRANCH}"; then
                return 0
              fi
              echo "Push alınmadı, yenidən cəhd ($i)..."
              sleep 4
            done
            echo "Push alınmadı"
            return 1
          }
          while true; do
            if python updater.py; then
              publish || echo "Bu dövrənin push-u alınmadı"
            else
              echo "updater.py xətası — status yenilənmir"
            fi
            LEFT=$((DURATION - (SECONDS - START)))
            if [ "$LEFT" -lt "$INTERVAL" ]; then
              echo "Dövr bitdi (${SECONDS}s). Növbəti növbədəki iş davam etdirir."
              exit 0
            fi
            echo "Növbəti yoxlama ${INTERVAL}s sonra (qalıq ${LEFT}s)"
            sleep "$INTERVAL"
          done
