name: Video xəbər (Facebook, Instagram)
# Sahib, 2026-11-22: «Facebook-da video xəbərlər verilsin… İnstagramda videolar verilsin. Videolarda başda 8ulduz.az yazılsın.»
# Ən vacib xəbərdən öz hazırladığımız şaquli video (başlıq, izah, brend, SARA səsi) → Facebook Reels və Instagram Reels.
# Seçim və paylaşma: .github/scripts/sosial-video.cjs, video: .github/scripts/video-xeber.cjs, sənəd: docs/sosial-video.md.
# Gündəlik hava videosu (sahib, 2026-11-23): eyni iş, ayrıca qayda — Bakı vaxtı HAVA_VAXT-dan (20:45) sonrakı ilk pəncərədə gündə bir dəfə
# sabahkı proqnoz (Open-Meteo + Pixabay + SARA, .github/scripts/video-hava.cjs). Eyni axınla FB/IG Reels, TikTok, YouTube Shorts-a gedir.
# Maraqlı videolar (sahib, 2026-11-24; Vikipediyanın faktları + Pixabay görüntüsü, .github/scripts/video-maraqli.cjs) 2026-11-26-dan
# söndürülüb (sahib: «nə heyvan nə təbiət nə kosmos»): susmaya görə hazırlanmır və paylaşılmır, PR nümunəsi (sınaq yolu) qalır.
# Yalnız Variables-da MARAQLI_VIDEO=1 açır; söndürülmüş halda «tur: maraqli» yalnız önizləmədir (paylas=false).
# Xəbər axınından (update.yml) və şəkilli paylaşmadan (social.yml) ayrıdır: düşsə də, gecikse də onlara təsir etmir. Repoya
# yazmır; video fayl yalnız şəbəkələrə və 3 günlük artefakta gedir.

on:
  # Hər 30 dəqiqə yoxlanır; video VIDEO_MIN_GAP_MIN (30) dəqiqədən bir, gündə VIDEO_GUNDE (30), Bakı vaxtı VIDEO_SAAT (8-23) saatlarında gedir.
  # Əsas tətik: xəbər axını (pipeline.sh video_loop) hər 30 dəqiqədə dispatch edir — bu cron 2026-11-22-də heç işləmədi; ehtiyatdır.
  # Vaxtı deyilsə iş ~20 saniyədə bitir (ffmpeg və səs modeli quraşdırılmır).
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      paylas:
        description: 'Paylaş (söndürsəniz video yalnız hazırlanır və iş səhifəsində artefakt kimi qalır)'
        type: boolean
        default: true
      xeber:
        description: 'Xəbər nömrəsi (16 simvol; boş — avtomatik seçim)'
        required: false
        default: ''
      tur:
        description: 'Video: avtomatik (cədvəl üzrə), hava (gündəlik hava proqnozu, dərhal), xeber (yalnız xəbər), maraqli (söndürülüb: yalnız önizləmə, «Paylaş»-ı götürün), dunya (dünya videosu tərcümə ilə, dərhal) və ya x (X-in ən çox baxılan videosu, dərhal)'
        type: choice
        options: [avtomatik, hava, xeber, maraqli, dunya, x]
        default: avtomatik
  # PR-da nümunə xəbərdən video hazırlanır və yoxlanır (paylaşılmır): kadrlar artefaktdadır.
  pull_request:
    paths:
      - .github/scripts/video-xeber.cjs
      - .github/scripts/video-hava.cjs
      - .github/scripts/video-maraqli.cjs
      - .github/scripts/video-ssenari.cjs
      - .github/scripts/video-dil.cjs
      - .github/video-dil/**
      - .github/scripts/video-arxiv.cjs
      - .github/scripts/video-menbe.cjs
      - .github/scripts/video-dunya.cjs
      - .github/video-dunya.json
      - .github/scripts/video_ses.py
      - .github/scripts/sosial-video.cjs
      - .github/workflows/sosial-video.yml
      - .github/ses-server/az_text.py
      - .github/ses-server/ses-lugat.json
      - tests/fixtures/video-xeber.json
      - tests/fixtures/video-hava.json
      - tests/fixtures/video-maraqli.json

permissions:
  contents: read

# Paylaşan işlər bir növbədədir (siyahı keşi). PR və önizləmə (paylas söndürülüb) öz budağının növbəsindədir: paylaşmanı gözlətmir, onun
# növbəsində ləğv olunmur və siyahını yazmır («Siyahını saxla»).
concurrency:
  group: sosial-video-${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.paylas)) && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  video:
    # Əl ilə önizləmə (paylas söndürülüb) istənilən budaqda işləyə bilər: yeni dizaynı main-dən əvvəl görmək üçün. Paylaşma
    # (FB/IG addımı, TikTok, YouTube) yalnız main-dədir.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.paylas)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # PR-da iki nümunə: xəbər (tests/fixtures/video-xeber.json) və hava (tests/fixtures/video-hava.json). Qalan hallarda bir iş (avto):
    # seçim özü qərar verir — hava vaxtıdırsa hava, yoxsa xəbər (bir pəncərədə bir video, pipeline.sh video_loop).
    strategy:
      fail-fast: false
      matrix:
        tur: ${{ fromJSON(github.event_name == 'pull_request' && '["xeber","hava","maraqli"]' || '["avto"]') }}
    # Növbəti iş (TikTok, tiktok.yml — PR 8ulduz/8ulduz#293 ilə) yalnız paylas == '1' olanda işləsin: PR nümunəsi və önizləmə getmir;
    # Facebook/Instagram alınmasa da (iş qırmızı) video hazırdırsa TikTok-a gedə bilər: `if: !cancelled() && needs.video.outputs.paylas == '1'`.
    # Video «video-xeber» artefaktındadır: video.mp4 + video.json (xəbərin sahələri, own: true).
    outputs:
      hazir: ${{ steps.sec.outputs.hazir }}
      # Maraqlı video (söndürülüb, 2026-11-26) TikTok və YouTube-a da getmir: yalnız MARAQLI_VIDEO=1 açır.
      paylas: ${{ steps.sec.outputs.hazir == '1' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.paylas) && (steps.sec.outputs.tur != 'maraqli' || vars.MARAQLI_VIDEO == '1') && '1' || '0' }}
      yoxlandi: ${{ steps.yoxla.outcome == 'success' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/social.cjs
            .github/scripts/topics.cjs
            .github/scripts/sosial-video.cjs
            .github/scripts/video-ssenari.cjs
            .github/scripts/video-dil.cjs
            .github/video-dil/
            .github/scripts/video-xeber.cjs
            .github/scripts/video-hava.cjs
            .github/scripts/video-maraqli.cjs
            .github/scripts/video-arxiv.cjs
            .github/scripts/video-menbe.cjs
            .github/scripts/video-dunya.cjs
            .github/video-dunya.json
            .github/scripts/veb-video.cjs
            .github/scripts/video_ses.py
            .github/scripts/video_dinle.py
            .github/ses-server/az_text.py
            .github/ses-server/ses-lugat.json
            assets/app.js
            assets/content-policy.js
            assets/logo.png
            data/news.json
            data/reels.json
            data/video-arxiv.json
            tests/fixtures/video-xeber.json
            tests/fixtures/video-hava.json
            tests/fixtures/video-maraqli.json
          sparse-checkout-cone-mode: false
      # Öz video arxivi (video-arxiv.cjs): kitabxana tarixçəsiz «video-arxiv» budağındadır (video-arxiv.yml yazır, main-ə yox).
      # Oxunmasa montaj repodakı başlanğıc nüsxəyə (data/video-arxiv.json) düşür; video bu addımdan asılı deyil.
      # Budaq tam adı ilə: eyni adlı buraxılış teqi (video-arxiv.yml) qısa adda budaqdan öndə gəlir (2026-11-25-dən arxiv oxunmurdu).
      - name: Video arxivi (video-arxiv budağı)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          if git fetch -q --depth 1 origin refs/heads/video-arxiv 2>/dev/null && git show FETCH_HEAD:video-arxiv.json > "$RUNNER_TEMP/video-arxiv.json"; then
            echo "VIDEO_ARXIV_FAYL=$RUNNER_TEMP/video-arxiv.json" >> "$GITHUB_ENV"
            echo "arxiv: video-arxiv budağından"
          else
            echo "arxiv: budaq oxunmadı — repodakı başlanğıc nüsxə (data/video-arxiv.json)"
          fi
      # Saranın oxunuş lüğətinə həftəlik əlavələr (ses-lugat.yml, tarixçəsiz «ses-lugat» budağı). az_text.py repodakı
      # ses-lugat.json ilə birləşdirir; budaq oxunmasa səs yalnız repodakı lüğətlə oxuyur.
      - name: Səs lüğəti (ses-lugat budağı)
        continue-on-error: true
        run: |
          if git fetch -q --depth 1 origin ses-lugat 2>/dev/null && git show FETCH_HEAD:lugat.json > .github/ses-server/ses-lugat-elave.json; then
            echo "lüğət: ses-lugat budağından əlavə"
          else
            rm -f .github/ses-server/ses-lugat-elave.json
            echo "lüğət: yalnız repodakı ses-lugat.json"
          fi
      - name: Videoların siyahısı
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: .sosial-video
          key: sosial-video-${{ github.run_id }}
          restore-keys: sosial-video-
      - name: Xəbər seç
        id: sec
        env:
          EVENT: ${{ github.event_name }}
          # Seçim açarı işlətmir, yalnız onun olub-olmadığını bilir (yoxdursa heç nə hazırlanmır). Facebook, TikTok (tiktok.yml) və ya
          # YouTube (youtube.yml) açarı olanda video hazırlanır; FB açarı olmayanda «Paylaş» addımı şəbəkəsiz qalır, heç nə göndərmir.
          VIDEO_ACAR: ${{ (secrets.FB_PAGE_TOKEN != '' || (secrets.TIKTOK_CLIENT_KEY != '' && secrets.TIKTOK_CLIENT_SECRET != '') || (secrets.YOUTUBE_CLIENT_ID != '' && secrets.YOUTUBE_CLIENT_SECRET != '' && secrets.YOUTUBE_REFRESH_TOKEN != '')) && '1' || '0' }}
          VIDEO_PAYLAS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.paylas) && '0' || '1' }}
          VIDEO_XEBER: ${{ inputs.xeber }}
          # Hava videosu: növ (əl ilə), saat və söndürmə (Variables). Open-Meteo açarı istəyə bağlıdır (ödənişli plan; pulsuz API açarsızdır).
          VIDEO_TUR: ${{ inputs.tur }}
          MATRIX_TUR: ${{ matrix.tur }}
          HAVA_VAXT: ${{ vars.HAVA_VAXT }}
          HAVA_VIDEO: ${{ vars.HAVA_VIDEO }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          # Sahib 2026-11-22: «Xəbər uzun olsun biraz və videogörüntü olsun o xəbərə uyğun» (video-ssenari.cjs). Biri yoxdursa
          # həmin hissə ötürülür: mətn mənbənin öz cümlələrindən, fon tünd göy.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIDEO_MIN_GAP_MIN: ${{ vars.VIDEO_MIN_GAP_MIN }}
          VIDEO_SAAT: ${{ vars.VIDEO_SAAT }}
          VIDEO_GUNDE: ${{ vars.VIDEO_GUNDE }}
          VIDEO_MIN_SOURCES: ${{ vars.VIDEO_MIN_SOURCES }}
          SOCIAL_MIN_SOURCES: ${{ vars.SOCIAL_MIN_SOURCES }}
          # Maraqlı video 2026-11-26-dan söndürülüb: yalnız MARAQLI_VIDEO=1 açır (boş — söndürülüb).
          MARAQLI_VIDEO: ${{ vars.MARAQLI_VIDEO }}
          MARAQLI_GUNDE: ${{ vars.MARAQLI_GUNDE }}
          MARAQLI_ARA_MIN: ${{ vars.MARAQLI_ARA_MIN }}
          # Mənbə saytının öz videosu (video-menbe.cjs) və dünya videoları (video-dunya.cjs; sahib, 2026-11-26). Söndürmək: 0.
          # MENBE_YAYIM=1 — oyun, film, klip kadrı da götürülsün (Content ID / Rights Manager riski: docs/sosial-video.md).
          MENBE_VIDEO: ${{ vars.MENBE_VIDEO }}
          MENBE_YAYIM: ${{ vars.MENBE_YAYIM }}
          DUNYA_VIDEO: ${{ vars.DUNYA_VIDEO }}
          DUNYA_GUNDE: ${{ vars.DUNYA_GUNDE }}
          DUNYA_ARA_MIN: ${{ vars.DUNYA_ARA_MIN }}
          # X videoları — «Çox baxılan» (data/reels.json; video-dunya.cjs xHazirla). Söndürmək: X_VIDEO=0.
          X_VIDEO: ${{ vars.X_VIDEO }}
          X_GUNDE: ${{ vars.X_GUNDE }}
          X_ARA_MIN: ${{ vars.X_ARA_MIN }}
          X_MIN_BAXIS: ${{ vars.X_MIN_BAXIS }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$MATRIX_TUR" = hava ]; then
            node .github/scripts/sosial-video.cjs numune-hava tests/fixtures/video-hava.json video-out
          elif [ "$EVENT" = pull_request ] && [ "$MATRIX_TUR" = maraqli ]; then
            node .github/scripts/sosial-video.cjs numune-maraqli tests/fixtures/video-maraqli.json video-out
          elif [ "$EVENT" = pull_request ]; then
            node .github/scripts/sosial-video.cjs numune tests/fixtures/video-xeber.json video-out
          else
            node .github/scripts/sosial-video.cjs sec data/news.json video-out
          fi
      - name: ffmpeg və şrift
        if: steps.sec.outputs.hazir == '1'
        run: |
          command -v ffmpeg >/dev/null && fc-list | grep -q Roboto-Black || {
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg fonts-roboto-unhinted >/dev/null
          }
          ffmpeg -hide_banner -filters | grep -qw ass
          fc-list : family style | grep -i roboto | sort | head -12
      # «Çox baxılan» X videosu (sahib, 2026-11-26: «Bu video 4 milyondan çox dəfə izlənib — nəyə lazımdır?»): baxış sayı deyilmir.
      # Paylaşımın mətnində əlavə fakt yoxdursa Gemini videonun kadrlarında açıq görünən 1–2 faktı yazır (video-dunya.cjs xKadrMetn;
      # kadrları ffmpeg çıxarır — ona görə bu addım ffmpeg-dən sonradır). Alınmasa mətn izah qalır; kadrda ölüm, qan, meyit görünürsə
      # iş dayanır (video paylaşılmır).
      - name: 'X: kadrlardan mətn'
        if: steps.sec.outputs.hazir == '1' && steps.sec.outputs.tur == 'x'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/sosial-video.cjs x-kadr video-out
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.sec.outputs.hazir == '1' && (vars.VIDEO_SES || '1') != '0'
        with:
          python-version: '3.12'
      # SARA modeli (~1 GB torch + model) hər dəfə yüklənməsin: pip və Hugging Face keşi.
      - name: Səs modelinin keşi
        if: steps.sec.outputs.hazir == '1' && (vars.VIDEO_SES || '1') != '0'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: video-ses-sara-v1
      # Səs alınmasa (quraşdırma, model) video səssiz hazırlanır: bu addım işi dayandırmır.
      # Səs Babəkdir (edge-tts, açarsız; sahib, 2026-11-25), Edge cavab verməsə SARA (torch + transformers) — ikisi də quraşdırılır.
      - name: Səs modeli
        if: steps.sec.outputs.hazir == '1' && (vars.VIDEO_SES || '1') != '0'
        continue-on-error: true
        run: |
          pip install -q "edge-tts>=7,<8"
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers numpy
      - name: Video hazırla
        if: steps.sec.outputs.hazir == '1'
        env:
          VIDEO_SES: ${{ vars.VIDEO_SES }}
          VIDEO_SES_MOTOR: ${{ vars.VIDEO_SES_MOTOR }}   # boş — Babək (SARA ehtiyat); «sara» — həmişə SARA
          VIDEO_ASS: '1'
          EVENT: ${{ github.event_name }}
          TUR: ${{ steps.sec.outputs.tur }}
        run: |
          # PR: görüntülü rejim süni kliplərlə yoxlanır (şaquli və üfüqi — ortadan kəsilir); açar və Pexels yoxdur.
          if [ "$EVENT" = pull_request ]; then
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=s=720x1280:r=25:d=5 -pix_fmt yuv420p video-out/klip-1.mp4
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i mandelbrot=s=1920x1080:r=30 -t 7 -pix_fmt yuv420p video-out/klip-2.mp4
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=s=1080x1920:r=30:d=4 -pix_fmt yuv420p video-out/klip-3.mp4
            node -e 'const fs=require("fs"),f="video-out/xeber.json",x=JSON.parse(fs.readFileSync(f,"utf8"));x.klipler=["klip-1.mp4","klip-2.mp4","klip-3.mp4"];x.goruntu=[{id:0,user:"sınaq"}];x.goruntuMenbe="Pixabay";fs.writeFileSync(f,JSON.stringify(x,null,1))'
          fi
          # Hava planı (tur: hava) — video-hava.cjs, xəbər — video-xeber.cjs. Çıxış müqaviləsi eynidir (video.mp4 + video.json).
          if [ "$TUR" = hava ]; then
            node .github/scripts/video-hava.cjs video-out/xeber.json video-out/video.mp4
          else
            node .github/scripts/video-xeber.cjs video-out/xeber.json video-out/video.mp4
          fi
          # Kliplər artefakta getmir (ölçü; TikTok/YouTube yalnız video.mp4 + video.json götürür).
          rm -f video-out/klip-*.mp4
      # Şəbəkələrin tələbi: 9:16, H.264 yuv420p, AAC 48 kHz, 3–90 s, moov əvvəldə (Instagram yükləməni oxuyarkən emal edir).
      - name: Videonu yoxla
        id: yoxla
        if: steps.sec.outputs.hazir == '1'
        env:
          TUR: ${{ steps.sec.outputs.tur }}
        run: |
          node -e '
            const fs = require("fs"), m = JSON.parse(fs.readFileSync("video-out/video.json", "utf8"));
            const head = fs.readFileSync("video-out/video.mp4").subarray(0, 1 << 20).toString("latin1");
            const bad = [];
            if (m.width !== 1080 || m.height !== 1920) bad.push(`ölçü ${m.width}×${m.height}`);
            if (m.vcodec !== "h264" || m.pix !== "yuv420p") bad.push(`video ${m.vcodec} ${m.pix}`);
            if (m.fps !== "30/1") bad.push(`kadr ${m.fps}`);
            if (m.acodec !== "aac" || m.rate !== 48000 || m.channels !== 2) bad.push(`səs ${m.acodec} ${m.rate} ${m.channels}`);
            if (!(m.duration >= 8 && m.duration <= 60)) bad.push(`müddət ${m.duration}`);
            if (!(m.bytes > 100000 && m.bytes < 100e6)) bad.push(`fayl ${m.bytes}`);
            const moov = head.indexOf("moov"), mdat = head.indexOf("mdat");
            if (moov < 0 || (mdat >= 0 && moov > mdat)) bad.push("moov əvvəldə deyil (faststart)");
            if (!head.includes("8ulduz.az")) bad.push("comment=8ulduz.az nişanı yoxdur (TikTok yükləyicisi)");
            if (m.own !== true || !m.id || !m.text) bad.push("video.json-da xəbərin sahələri yoxdur");
            if (process.env.TUR === "maraqli" && (m.kind !== "maraqli" || m.url !== "https://8ulduz.az/" || m.source !== "Vikipediya" || !String(m.sourceUrl || "").startsWith("https://en.wikipedia.org/wiki/"))) bad.push("maraqlı videonun video.json-u: kind, url və ya Vikipediya mənbəyi yoxdur");
            if (process.env.TUR === "hava" && (m.kind !== "hava" || !String(m.url || "").startsWith("https://8ulduz.az/") || !m.text.includes("Open-Meteo"))) bad.push("hava videosunun video.json-u: kind, url və ya Open-Meteo krediti yoxdur");
            console.log(JSON.stringify(m));
            if (bad.length) { console.log("::error::Video tələbə uyğun deyil: " + bad.join("; ")); process.exit(1); }
          '
          # Kadrlar: ilk kadr (lentdə avtomatik oynayanda görünən) və video.json-dakı anlar (başlıq, iki altyazının ortası, sonluq).
          ffmpeg -hide_banner -loglevel error -y -ss 0.15 -i video-out/video.mp4 -frames:v 1 video-out/kadr-ilk.png
          i=0
          for t in $(node -p 'JSON.parse(require("fs").readFileSync("video-out/video.json","utf8")).kadrlar.join(" ")'); do
            i=$((i + 1))
            ffmpeg -hide_banner -loglevel error -y -ss "$t" -i video-out/video.mp4 -frames:v 1 "video-out/kadr-$i.png"
          done
          # Önizləmə: kadrlar yan-yana, hər biri 270×480.
          args=() ; f=""
          for k in $(seq 1 "$i"); do args+=(-i "video-out/kadr-$k.png"); f="$f[$((k - 1))]scale=270:480[k$k];"; done
          ffmpeg -hide_banner -loglevel error -y "${args[@]}" -filter_complex "$f$(for k in $(seq 1 "$i"); do printf '[k%s]' "$k"; done)hstack=$i" -q:v 4 video-out/onizleme.jpg
          # Səsdəki fasilələr (≥ 0,12 s, −40 dB-dən sakit): cümlə sonu, cümlə içindəki nəfəs və sonluqdakı çağırışın fasiləsi
          # (sahib, 2026-11-25: «Abunə ol deyib pauza vermir»). Qulaqla yoxlamaq olmayan yerdə rəqəmlə görünür; işi dayandırmır.
          ffmpeg -hide_banner -nostats -i video-out/video.mp4 -vn -af silencedetect=noise=-40dB:d=0.12 -f null - 2>&1 \
            | grep -o -E "silence_(start|end): [0-9.]+( \| silence_duration: [0-9.]+)?" > video-out/fasileler.txt || true
          {
            if [ "$TUR" = hava ]; then echo "### Hava videosu"; elif [ "$TUR" = maraqli ]; then echo "### Maraqlı video"; else echo "### Video xəbər"; fi
            node -p 'const m=JSON.parse(require("fs").readFileSync("video-out/video.json","utf8")), D=require("./.github/scripts/video-dil.cjs").videonunDili(m); `${m.title}\n\n${m.width}×${m.height}, ${m.duration.toFixed(1)} s, ${(m.bytes/1e6).toFixed(1)} MB, ${m.voice ? `səsli (${m.ses === "sara" ? "SARA" : m.ses === D.ses.motor ? D.ses.ad : m.ses})` : "səssiz"}, ${m.parts} hissə`'
            # Kliplər montaj sırası ilə; öz video arxivindən (data/video-arxiv.json) gələnin arxiv nömrəsi və yoxlanmış yeri.
            node -p 'const g=JSON.parse(require("fs").readFileSync("video-out/xeber.json","utf8")).goruntu||[]; g.length ? "\nGörüntü: " + g.map((k,i)=>`${i+1}) ${k.arxiv ? `ARXİV ${k.arxiv} — ${k.yer}` : `${k.p || "klip"} ${k.id ?? ""}${k.q ? ` «${k.q}»` : ""}`}`).join("; ") : ""'
          } >> "$GITHUB_STEP_SUMMARY"
      # PR: nümunə videonun səsi Whisper ilə «dinlənir» (sahib, 2026-11-25: «iyirmibeş sözünü dinlə. azərtacdan sonra nə deyir
      # dinlə … sən tapmadın?»): oxunmalı mətnlə eşidilən müqayisə olunur, səhv eşidilən və itən sözlər xülasədədir (dinleme.md
      # artefaktda). Whisper özü də səhv edir — iş dayanmır. Model (~3 GB) keşə yazılmır: keşdəki paylaşım siyahıları sıxışdırılmasın.
      - name: Səsi dinlə (Whisper)
        if: github.event_name == 'pull_request' && steps.yoxla.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install -q faster-whisper
          python3 .github/scripts/video_dinle.py video-out/video.mp4 video-out/video.json >> "$GITHUB_STEP_SUMMARY"
      # Saytın «Video xəbərlər» zolağı üçün kiçik nüsxə (sahib, 2026-11-25: «gözqırpımı»; veb-video.cjs): 720×1280, ≤ 2,8 MB, moov əvvəldə.
      # Artefaktda veb.mp4 kimi qalır (cütü veb.json yoxdur: TikTok/YouTube yükləyicisi onu götürmür). «veb-video» işi onu YouTube
      # nömrəsi ilə R2-yə yazır. Alınmasa paylaşma dayanmır: zolaq bu videonu YouTube oynadıcısı ilə göstərir.
      - name: Veb nüsxə
        if: steps.sec.outputs.hazir == '1' && steps.yoxla.outcome == 'success'
        continue-on-error: true
        run: node .github/scripts/veb-video.cjs hazirla video-out/video.mp4 video-out/veb.mp4
      - name: Paylaş
        if: steps.sec.outputs.hazir == '1' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.paylas) && (steps.sec.outputs.tur != 'maraqli' || vars.MARAQLI_VIDEO == '1')
        env:
          MARAQLI_VIDEO: ${{ vars.MARAQLI_VIDEO }}   # paylas maraqlı videonu yalnız 1 olanda göndərir (2026-11-26)
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '1470250006171917' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          INSTAGRAM: ${{ vars.INSTAGRAM }}
          VIDEO_FACEBOOK: ${{ vars.VIDEO_FACEBOOK }}
          VIDEO_INSTAGRAM: ${{ vars.VIDEO_INSTAGRAM }}
          VIDEO_FB_SERH: ${{ vars.VIDEO_FB_SERH }}
        run: node .github/scripts/sosial-video.cjs paylas video-out
      - name: Siyahını saxla
        # Önizləmə siyahını dəyişmir: onun köhnə nüsxəsi paralel paylaşmanın yazdığını üstələməsin (eyni xəbər iki dəfə getməsin).
        if: always() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.paylas)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: .sosial-video
          key: sosial-video-${{ github.run_id }}
      - name: Video (artefakt, 3 gün)
        if: steps.sec.outputs.hazir == '1' && !cancelled()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          # Main-də ad həmişə video-xeber (tiktok.yml/youtube.yml bunu götürür); PR nümunələri video-xeber, video-hava, video-maraqli.
          name: ${{ matrix.tur == 'avto' && 'video-xeber' || format('video-{0}', matrix.tur) }}
          path: video-out/
          retention-days: 3

  # TikTok (tiktok.yml, docs/tiktok.md §7): yalnız main-də, əsl paylaşım dövrəsində (paylas == '1': PR nümunəsi və paylas=false
  # önizləməsi getmir) və video yoxlamadan keçəndə. Facebook/Instagram alınmasa da (video işi qırmızı) hazır video TikTok-a gedir.
  # Yalnız TikTok sirləri verilir (Facebook açarı bu işə getmir).
  tiktok:
    needs: video
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.video.outputs.paylas == '1' && needs.video.outputs.yoxlandi == '1' }}
    uses: ./.github/workflows/tiktok.yml
    with:
      artifact: video-xeber
    secrets:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}

  # YouTube Shorts (youtube.yml, docs/youtube.md §8): tiktok işi ilə eyni şərtlər — yalnız main-də, əsl paylaşım dövrəsində və video
  # yoxlamadan keçəndə. Facebook/Instagram alınmasa da hazır video YouTube-a gedir. Yalnız YouTube sirləri verilir.
  youtube:
    needs: video
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.video.outputs.paylas == '1' && needs.video.outputs.yoxlandi == '1' }}
    uses: ./.github/workflows/youtube.yml
    with:
      artifact: video-xeber
    secrets:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

  # Saytın öz videosu adi <video> ilə (sahib, 2026-11-25: «video xəbərlərdə bəzi videolar (əsasən azərbaycan) 1-2 saniyəyə açılır …
  # gözqırpımı»): YouTube oynadıcısı basışdan ilk kadra 1,7–2,4 s gedirdi, X videosu (adi <video>) 0,2–0,5 s. YouTube-a bu dövrədə
  # yüklənən videonun veb nüsxəsi (veb.mp4) Cloudflare R2-yə yazılır: https://video.8ulduz.az/<YouTube nömrəsi>.mp4 + index.json.
  # updater.py (yavaş dövrə) index.json-u oxuyub data/video.json-a «mp4» yazır, assets/vlent.js onu oynadır. Repoya yazmır.
  # R2 açarı yoxdursa sakitcə ötürür (qurulum: docs/veb-video.md); alınmasa zolaq YouTube oynadıcısı ilə qalır. Yalnız R2 sirləri verilir.
  veb-video:
    needs: [video, youtube]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.youtube.outputs.video_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # index.json-u eyni anda iki iş oxuyub yazmasın.
    concurrency:
      group: veb-video
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/veb-video.cjs
          sparse-checkout-cone-mode: false
      - name: Videonu al
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: video-xeber
          path: video-out
      - name: R2-yə yaz
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          VIDEO_ID: ${{ needs.youtube.outputs.video_id }}
        run: node .github/scripts/veb-video.cjs yukle video-out/veb.mp4 "$VIDEO_ID"
