name: Öz xəbər modulu
# Öz xəbər modullarının (oz_*.py) testləri və nümunələri, yalnız oz-f1-* / oz-f2-* sınaq budaqlarında (sahib, 2026-11-10: «Bəli, başla», «Mərhələ 2-ni qur»).
# Sayta və repoya heç nə yazmır: main-in məlumatı yalnız oxunur, nəticə iş səhifəsində və «oz-modul-sinaq» artefaktındadır.

on:
  push:
    branches: ['oz-f1-**', 'oz-f2-**', 'oz-f3-**']

permissions:
  contents: read

concurrency:
  group: oz-modul-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modul:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Saytın məlumatı (main, yalnız oxumaq üçün)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: site
          sparse-checkout: |
            data/futbol/
            data/football.json
            data/markets.json
            data/news.json
            data/sports.json
            data/milli-menyu.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testlər (uğursuzluqlar annotasiya kimi)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_oz_*.py' -v 2>&1 | tee /tmp/ut.txt || {
            grep -nE '^(FAIL|ERROR):|Error:|^AssertionError|^  File "' /tmp/ut.txt | head -60 | sed 's/^/::error::/'
            exit 1
          }
      - name: Nümunələr
        if: always()
        run: |
          : > oz-modul-sinaq.md
          for m in oz_*.py; do
            [ "$m" = oz_xeber.py ] && continue
            echo "# $m" >> oz-modul-sinaq.md
            python -u "$m" --sinaq --root site >> oz-modul-sinaq.md 2>&1 || echo "> $m sınağı xəta ilə bitdi" >> oz-modul-sinaq.md
          done
          cat oz-modul-sinaq.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: oz-modul-sinaq
          path: oz-modul-sinaq.md
          if-no-files-found: ignore
