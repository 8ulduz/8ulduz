name: Profillərdə paylaş
# Saytın ən vacib xəbərləri öz profillərimizdə (Telegram, Facebook səhifəsi, X, LinkedIn). Qayda və açarlar: .github/scripts/social.cjs.
# Xəbər axınından (update.yml) ayrıdır: bu iş düşsə də, gecikse də lent yenilənməyə davam edir. main-ə yazmır; «ig» işi yalnız
# 8ulduz.az/ig/ siyahısını ayrıca «ig» budağına yazır.

on:
  # Əsas tətik: xəbər pipeline-ı main-ə yazandan 90 s sonra bu işi dispatch edir (pipeline.sh publish_main, ~10 dəqiqədə bir).
  # GitHub cron-u saatlarla gecikir/atılır (2026-11-05: :47 və :07 gəlmədi), Pages yayımı workflow_run başlatmır; cron ehtiyatdır.
  # Postlar arası fasilə social.cjs-dədir (SOCIAL_MIN_GAP_MIN, 18 dəq): saatda ən çox 3 post.
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      fb_yenile:
        description: 'Bugün www keçidi ilə paylaşılmış Facebook postlarının kartını yenidən oxut (şəkilsiz qalanlar şəkil alır)'
        type: boolean
        default: false
  # Skript və ya iş axını main-də dəyişəndə dərhal bir dövrə (cron yeni iş axınını gec qoşur; təkrar post yoxdur, siyahı keşdədir).
  push:
    branches: [main]
    paths:
      - .github/workflows/social.yml
      - .github/scripts/social.cjs
      - .github/scripts/indexnow.cjs

permissions:
  contents: read

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/social.cjs
            .github/scripts/topics.cjs
            .github/scripts/indexnow.cjs
            assets/app.js
            assets/content-policy.js
            data/news.json
            xeber/index.json
            icmal/index.json
            /*.txt
          sparse-checkout-cone-mode: false
      - name: Paylaşılanların siyahısı
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: .social
          key: social-state-${{ github.run_id }}
          restore-keys: social-state-
      - name: Paylaş
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '1470250006171917' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR: ${{ vars.LINKEDIN_AUTHOR }}
          SOCIAL_MIN_SOURCES: ${{ vars.SOCIAL_MIN_SOURCES }}
          SOCIAL_PER_RUN: ${{ vars.SOCIAL_PER_RUN }}
          FB_RESCRAPE: ${{ inputs.fb_yenile && '1' || '' }}
        run: node .github/scripts/social.cjs data/news.json
      # Yeni xeber/<id>/ səhifələri Bing və Yandex-ə (IndexNow). Düşsə də paylaşmaya və siyahının saxlanmasına təsir etmir.
      - name: IndexNow
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/scripts/indexnow.cjs
      - name: Siyahını saxla
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: .social
          key: social-state-${{ github.run_id }}
      # 8ulduz.az/ig/ səhifəsinin siyahısı (social.cjs igGrid): yalnız Instagram qoşulu olanda yaranır; açar faylda yoxdur.
      - name: Instagram siyahısı
        if: ${{ !cancelled() && hashFiles('ig-out/ig.json') != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ig
          path: ig-out/ig.json
          retention-days: 1

  # Siyahını «ig» budağına yazır (tarixçəsiz, bir fayl; 8ulduz.az/ig/ oradan oxuyur). Ayrıca iş: yazma icazəsi yalnız buradadır,
  # sosial şəbəkə açarları bu işə verilmir. main-ə və saytın xəbər axınına toxunmur.
  ig:
    needs: post
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Siyahını al
        id: al
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ig
          path: ig
      - name: «ig» budağına yaz
        if: ${{ steps.al.outcome == 'success' && hashFiles('ig/ig.json') != '' }}
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          cd ig
          node -e 'const d=JSON.parse(require("fs").readFileSync("ig.json","utf8")); if(!Array.isArray(d.items)||!d.items.length) process.exit(1)'
          git init -q
          git add ig.json
          git -c user.name=8ulduz-bot -c user.email=bot@8ulduz.az commit -q -m "Instagram siyahısı"
          git push -q --force "$URL" HEAD:refs/heads/ig
