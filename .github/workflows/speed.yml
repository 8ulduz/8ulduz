name: Sürət ölçüsü
# Qırmızı xətt 3 (sahib 2026-11-06: «gözqırpımı sürət», bütün bölmə və alt bölmələr, «eyni problem bir daha təkrarlanmasın»).
# .github/scripts/speed.cjs başsız Chrome-da telefonu təqlid edir (412 px, toxunma, 4× yavaş prosessor, mobil şəbəkə) və
# soyuq açılışı (ilk boya, CLS, LCP, boyadan əvvəlki uzun tapşırıqlar, sorğular), mənbəyə gedib qayıtmağı (bfcache), paylaşılan xəbəri,
# 14 bölməni, alt bölmələri, rayonları, liqa və komanda səhifələrini, xəbəri, axtarışı, kompüter keçidini ölçür.
# PR-da: bu nüsxə 8080-də, PR-ın hədəf budağı (baza) 8081-də — eyni anda A, B, A, B, A, B ölçülür; bu nüsxə bazadan yavaşsa qırmızı
# (eyni kod runner-də 3,5 Lighthouse balı oynayır, mütləq büdcə reqressiyanı görmürdü). main-ə push: yalnız büdcə.
# Gecə və gün ərzində: canlı sayt, tam dövrə + üçüncü tərəf yönləndirmələri, xəbər səhifələrinin şablon versiyası, məlumat gzip ölçüləri.
# Büdcələr tests/budce.json «speed» qrupundadır; yeni ölçülər ilk 10 planlı dövrədə yalnız xəbərdarlıqdır (speed.yeni.sert).
# Xəbər axınından (update.yml) və yayımdan ayrıdır: heç nəyi dayandırmır, repoya yazmır.

on:
  pull_request:
    paths: ['assets/**', 'index.html', 'sw.js', '.github/scripts/speed.cjs', '.github/scripts/serve.cjs', '.github/workflows/speed.yml', 'tests/budce.json']
  push:
    branches: [main]
    paths:
      - assets/**
      - index.html
      - sw.js
      - .github/scripts/speed.cjs
      - .github/scripts/serve.cjs
      - .github/workflows/speed.yml
      - tests/budce.json
  schedule:
    - cron: "17 1,7,11,15 * * *"   # gecə + gün ərzində (lent böyüyəndə yavaşlama kod dəyişmədən də ola bilər; sahib 2026-11-07)
  workflow_dispatch:
    inputs:
      canli:
        description: 'Canlı saytı ölç (gecə dövrəsi kimi: tam dövrə, üçüncü tərəflər, səhifələr, məlumat)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: speed-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  speed:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Baza nüsxəsi (PR-ın hədəf budağı, A/B üçün)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
      - name: Bu nüsxə (yerli server, qısa dövrə; PR-da baza ilə A/B)
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.canli)
        env:
          SPEED_QUICK: "1"
          SPEED_REPS: "3"
          SPEED_JSON: speed.json
        run: |
          node .github/scripts/serve.cjs . 8080 &
          AB=()
          if [ -d base ]; then
            node .github/scripts/serve.cjs base 8081 &
            AB=(--ab http://localhost:8081/)
          fi
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium)" node .github/scripts/speed.cjs http://localhost:8080/ --budget "${AB[@]}"
      - name: Canlı sayt (tam dövrə, gecə yoxlamaları)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.canli)
        env:
          SPEED_REPS: "2"
          SPEED_JSON: speed.json
          GH_TOKEN: ${{ github.token }}   # --pages: STORY_VER artımının vaxtı (commits API)
        run: CHROME="$(command -v google-chrome || command -v chromium)" node .github/scripts/speed.cjs https://8ulduz.az/ --budget --third-party --pages --data
      - name: Ölçülər
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: speed
          path: speed.json
          retention-days: 30
