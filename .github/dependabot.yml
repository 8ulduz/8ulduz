# İşlər commit-ə bağlıdır (.github/workflows): yenilənmələr ayda bir PR kimi gəlir, özü birləşmir.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
