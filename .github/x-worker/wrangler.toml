# Paylaşma keçidi serveri (worker.js) — Cloudflare Workers, pulsuz plan. Yükləmə: bu qovluqda «npx wrangler deploy»
# və ya Cloudflare panelində kodu yapışdırmaq (docs/x-worker.md). Ünvanlar: Settings → Domains & Routes → Custom domain www.8ulduz.az (2026-11-09-dan əsas) və x.8ulduz.az (köhnə keçidlər).
name = "x"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
# Ünvan: 8ulduz.az zonası eyni Cloudflare hesabında olmalıdır (DNS 2026-11-03-dən Cloudflare-dədir). Panelden də əlavə etmək olar.
# www-nun köhnə CNAME qeydi (8ulduz.github.io, yalnız yönləndirirdi) deploy-dan əvvəl Cloudflare DNS-dən silinir: custom domain qeydi Cloudflare özü yaradır.
routes = [{ pattern = "www.8ulduz.az", custom_domain = true }, { pattern = "x.8ulduz.az", custom_domain = true }]
