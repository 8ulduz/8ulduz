    <!-- Daxili skript yalnız aşağıdakının hash-i ilə işləyir: onu dəyişəndə hash də dəyişir (test tutur). connect-src qəsdən yoxdur: canlı kanala sorğu heç vaxt burada bloklanmasın. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-FceUHjCqCm9aD/8nMBlxFCEqJEU48uMNvhl7Vpq0twM=' https://gc.zgo.at; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com https://embed.waze.com" />
    <!-- Kod xəbər faylından əvvəl soruşulur: telefonda 220 KB-lıq lent onunla eyni xətti bölüşür -->
    <link rel="modulepreload" href="./assets/app.js" />
    <script>
      // Sayt başqa saytın çərçivəsində işləmir: GitHub Pages frame-ancestors başlığı göndərə bilmir.
      if (top !== self) document.documentElement.style.display = "none";
      // CSP daxili onload-u bloklayır: şrift səhifəni bloklamadan gəlir.
      document.addEventListener("load", function (e) {
        var l = e.target;
        if (l.rel === "stylesheet" && l.media === "print") l.media = "all";
      }, true);
      try {
        var t = localStorage.getItem("8ulduz-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        var f = localStorage.getItem("8ulduz-fs");
        if (f === "0" || f === "1" || f === "2") document.documentElement.dataset.fs = f;
      } catch (e) {}
      // Xəbər və şəkil keşini app.js yüklənməsini gözləmədən soruş (telefonda ilk göstərilmə tezləşir).
      // app.js eyni ünvanı (freshUrl) birinci dəfə bu cavabdan götürür.
      try {
        var m = Math.floor(Date.now() / 60000);
        window.__early = {};
        var lang = null;
        try { lang = localStorage.getItem("8ulduz-lang"); } catch (e) {}
        var home = (location.hash === "" || location.hash === "#/") && (lang === null || lang === "az");
        (home ? ["data/first.json"] : ["data/news.json", "data/og.json"]).forEach(function (p) {
          var u = p + "?t=" + m;
          window.__early[u] = fetch(u, { cache: "no-store" });
          window.__early[u].catch(function () {});
        });
      } catch (e) {}
    </script>
